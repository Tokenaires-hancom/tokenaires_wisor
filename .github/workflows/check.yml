# PR 필수 검사 — 기계가 판정하는 사실만 본다.
#
# 여기 있는 건 전부 통과/실패가 명확하고 틀릴 수 없는 것들이라, 실패하면
# 병합을 막는다(branch protection의 필수 상태 검사로 등록돼 있다).
#
# 판단이 필요한 것 — 클린 코드 5원칙 중 파급범위·중복·패턴·의도 — 은 여기서
# 다루지 않는다. push 전에 .claude/skills/clean-check/SKILL.md 가 로컬에서
# 판정하고 코멘트만 남긴다. LLM 판단은 틀릴 수 있고 이 팀은 반박할 수단이
# 없어서, 사실과 판단을 같은 곳에서 섞지 않는다.
#
# 설계: docs/superpowers/specs/2026-08-19-clean-code-check-skill-design.md

name: PR 필수 검사

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened]
    # paths 필터를 걸지 않는다. 필수 검사 `check`는 이 워크플로가 실제로 돌아야
    # 보고되는데, 필터에 걸러진 PR에서는 아예 돌지 않는다. 그러면 검사가 실패한
    # 것도 통과한 것도 아닌 "보고 대기"로 남아 병합이 영원히 막힌다.
    # docs만 고친 PR에 테스트를 다 돌리는 CI 시간이, 그 교착보다 싸다.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: main으로 오는 PR은 develop에서만 온다
        # 기능 브랜치가 main으로 바로 들어가면 main과 develop이 양방향으로
        # 갈라지고, 그것을 되돌리는 sync 브랜치가 또 생긴다(#66·#67 → #75 → #77).
        # main은 보호돼 있지 않아 이 검사는 빨간 X만 남기고 병합을 막지는 못한다.
        # 막으려면 데이터 push를 별도 흐름으로 옮기는 것이 먼저다 — docs/oci-autodeploy.md.
        # workflow_call로 불릴 때는 pull_request가 비어 있어 이 스텝은 건너뛴다.
        if: >-
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.ref != 'develop'
        run: |
          echo "main으로 가는 PR은 develop에서만 엽니다."
          echo "지금 head: ${{ github.event.pull_request.head.ref }}"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: pip install pytest

      - name: OCI 배포 계약 테스트
        run: |
          for test_script in deploy/oci/tests/test-*.sh; do
            bash "${test_script}"
          done
          python -m unittest discover -s deploy/oci/tests -p 'test_*.py'

      - name: 화면 데이터가 예시로 덮였는지 검사
        # run_batch.py가 예시 데이터로 실파일을 덮는 것은 막았지만, 손으로 편집하거나
        # --out을 실파일로 명시하는 경로는 남아 있다. 그 사고는 배포될 때까지 아무
        # 신호가 없다 — 빌드도 테스트도 JSON이 유효하기만 하면 통과하고, 20,148줄
        # diff에서 380이 12가 된 것을 눈으로 잡기는 어렵다. 여기가 마지막 관문이다.
        run: |
          python - <<'PY'
          import json
          d = json.load(open("apps/web/lib/generated/scores.json", encoding="utf-8"))
          n = len(d["companies"])
          if d["dataSource"] == "sample":
              print(f"화면이 읽는 scores.json이 예시 데이터입니다({n}종목).")
              print("실데이터 배치 결과를 커밋하세요: --provider sec-toss --universe data/universe_us.json")
              raise SystemExit(1)
          print(f"실데이터 {n}종목 (dataSource={d['dataSource']})")
          PY

      - name: data-pipeline 테스트
        working-directory: data-pipeline
        run: python -m pytest -q

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # netlify.toml의 NODE_VERSION과 맞춘다. CI가 통과해도 배포 버전이
          # 다르면 의미가 없다.
          node-version: "24"

      - name: web 의존성
        working-directory: apps/web
        run: npm ci

      - name: web 테스트
        working-directory: apps/web
        # 이게 없으면 apps/web 테스트는 아무도 안 돌린다. 로컬 훅은 push를 막지
        # 않고 clean-check도 "테스트가 있나"만 보므로, 여기가 유일하게 "통과하나"를
        # 보는 자리다. data-pipeline은 위 pytest가 같은 역할을 한다.
        run: npm test

      - name: web 빌드
        working-directory: apps/web
        run: npm run build

      - name: web 타입 검사
        working-directory: apps/web
        # npm run build는 앱 빌드 그래프 밖의 *.test.ts 타입 오류를 못 잡는다.
        run: npx tsc --noEmit

      - name: 재무데이터 유출 검사
        working-directory: apps/web
        # 클라이언트 컴포넌트가 lib/scores.ts를 import하면 scores.json 전체가
        # 브라우저 번들에 실린다(루트 CLAUDE.md "절대 하지 말 것" 참고).
        # 빌드 결과물을 보므로 중간 모듈을 거친 간접 유출까지 잡힌다.
        run: |
          if grep -rl "evEbitMedian5y" .next/static/; then
            echo "재무데이터가 브라우저 번들에 실렸습니다. 위 파일을 확인하세요."
            exit 1
          fi
          echo "번들에 재무데이터 누출 없음."
