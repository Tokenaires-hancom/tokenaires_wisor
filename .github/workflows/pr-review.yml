# PR 자동검사
#
# 규칙으로 판단 가능한 것만 본다. develop과 병합 가능한지, 두 영역
# (data-pipeline·web)의 커밋 전 필수 명령을 PR마다 자동으로 돌리고, 경계
# 검사를 추가로 한다. 문구·원칙처럼 판단이 필요한 것은 여기서 다루지 않는다
# (docs/superpowers/specs/2026-08-11-pr-review-system-design.md 참고).
#
# 병합 가능 여부는 "지금" 기준이다. 이 PR을 연 뒤 다른 PR이 먼저 develop에
# 들어가면서 같은 자리를 건드리면 사후적으로 충돌이 생길 수 있고, 그건 이
# PR에 새 커밋이 push될 때(= 이 워크플로가 다시 돌 때)까지는 못 잡는다.
# 동시에 열린 두 PR끼리의 충돌은 어느 한쪽도 아직 develop에 없으므로 원천적으로
# 못 잡는다.
#
# 결과는 코멘트 하나로만 남긴다. push마다 새 코멘트를 달면 코멘트가 쌓여서
# 정작 중요한 걸 찾기 어려워지므로, 숨김 마커로 기존 코멘트를 찾아 고쳐 쓴다.
#
# 아무것도 병합을 막지 않는다. 브랜치 보호 규칙에 연결하지 않았다 — 병합
# 여부는 사람이 이 코멘트를 보고 정한다.
#
# PR 제목·본문 형식 검사(CLAUDE.md의 "type: 설명" 규칙, PR 템플릿 세 섹션)는
# 그중에서도 특히 더 약하게 다룬다 — 실패해도 이 워크플로 자체의 성패에
# 반영하지 않는다(아래 "위반 있으면 실패로 표시"의 조건에서 뺐다). 형식은
# 참고만 하고 항상 코멘트로만 알려준다.
#
# 불필요한 재실행을 두 가지로 막는다.
# ① docs/**만 바뀐 PR은 아래 paths-ignore 때문에 이 워크플로 자체가 안 걸린다.
# ② 이미 검사한 커밋 그대로 PR을 닫았다 다시 연 경우(reopened, 새 커밋 없음),
#    check-if-needed 잡이 sticky 코멘트에 남은 reviewed-sha와 지금 head sha를
#    비교해서 같으면 본 작업을 건너뛴다.

name: PR 자동검사

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"

permissions:
  pull-requests: write
  contents: read

concurrency:
  # 같은 PR에 연달아 푸시하면 이전 실행은 의미가 없다. scores.yml과 반대로
  # 여기서는 최신 커밋 결과만 필요하므로 이전 실행을 취소한다.
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-if-needed:
    # reopened일 때만 돈다. opened·synchronize는 항상 새로 봐야 하므로 그대로
    # 통과시킨다(아래 always()로 already_reviewed가 비어 있어도 본 잡이 돈다).
    runs-on: ubuntu-latest
    if: github.event.action == 'reopened'
    permissions:
      pull-requests: read
    outputs:
      already_reviewed: ${{ steps.check.outputs.already_reviewed }}
    steps:
      - name: 같은 커밋을 이미 검사했는지 확인
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MARKER: "<!-- wisor-auto-checks -->"
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          REVIEWED_SHA=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$MARKER\"))][0].body // empty" \
            | grep -oP '(?<=<!-- reviewed-sha: )[0-9a-f]+(?= -->)' || true)
          if [ "$REVIEWED_SHA" = "$HEAD_SHA" ]; then
            echo "already_reviewed=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_reviewed=false" >> "$GITHUB_OUTPUT"
          fi

  auto-checks:
    needs: check-if-needed
    if: always() && needs.check-if-needed.outputs.already_reviewed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: develop 병합 가능 여부 검사
        id: merge_check
        continue-on-error: true
        # PR을 열 때는 안 겹쳤어도, 그 뒤 다른 PR이 먼저 develop에 들어가면서
        # 같은 자리를 건드리면 사후적으로 충돌이 생긴다(예: PR #13). 이 저장소
        # 다른 검사는 전부 "PR 브랜치 자체"만 보고 develop과 실제로 합쳐보지
        # 않으므로, 이 단계 없이는 아무도 못 잡는다. 뒤 단계(빌드·테스트)에
        # 영향 안 주도록 병합 시도 후 반드시 원래 커밋으로 되돌린다.
        run: |
          set +e
          HEAD_SHA=$(git rev-parse HEAD)
          git fetch --unshallow origin 2>/dev/null
          git fetch origin develop
          git merge --no-commit --no-ff origin/develop > merge_check_output.txt 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo >> merge_check_output.txt
            echo "충돌 파일:" >> merge_check_output.txt
            git diff --name-only --diff-filter=U >> merge_check_output.txt
          fi
          git merge --abort 2>/dev/null
          git reset --hard "$HEAD_SHA" > /dev/null
          exit $STATUS

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PR 제목·본문 형식 검사 (소프트 게이트)
        id: format_check
        continue-on-error: true
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/pr_checks/pr_format_check.py | tee format_check_output.txt

      - name: data-pipeline 의존성 (pytest만 필요)
        run: pip install pytest

      - name: data-pipeline pytest -q
        id: dp_test
        continue-on-error: true
        working-directory: data-pipeline
        run: python -m pytest -q | tee ../dp_test_output.txt

      - uses: actions/setup-node@v4
        with:
          # netlify.toml의 NODE_VERSION과 맞춘다. CI가 통과해도 배포 버전이
          # 다르면 의미가 없다.
          node-version: "24"

      - name: web 의존성
        working-directory: apps/web
        run: npm ci

      - name: web npm run build
        id: web_build
        continue-on-error: true
        working-directory: apps/web
        run: npm run build | tee ../../web_build_output.txt

      - name: web 번들 누출 검사
        id: bundle_leak
        continue-on-error: true
        working-directory: apps/web
        # apps/web/CLAUDE.md에 이미 적힌 확인 명령을 그대로 자동화한다.
        # 직접 import뿐 아니라 중간 모듈을 거친 간접 누출까지 잡는다.
        run: |
          {
            if [ -d .next/static ] && grep -rl "evEbitMedian5y" .next/static/ > /dev/null 2>&1; then
              echo "재무데이터가 클라이언트 번들에 실렸습니다."
              grep -rl "evEbitMedian5y" .next/static/
              exit 1
            fi
            echo "번들에 재무데이터 누출 없음."
          } | tee ../../bundle_leak_output.txt

      - name: web tsc --noEmit
        id: tsc_check
        continue-on-error: true
        working-directory: apps/web
        # npm run build는 앱 빌드 그래프 밖의 *.test.ts 파일 타입 오류를 못
        # 잡는다(2026-08-10 fa9eb89 커밋에서 실제로 있었던 일). tsc는 잡는다.
        run: npx tsc --noEmit | tee ../../tsc_check_output.txt

      - name: 경계 검사 (lib/scores import)
        id: boundary_check
        continue-on-error: true
        run: python scripts/pr_checks/boundary_check.py | tee boundary_check_output.txt

      - name: 문자 그대로의 중복 검사
        id: duplicate_check
        continue-on-error: true
        # 로컬 pre-commit 훅(.githooks/pre-commit, .claude/hooks/require-review-before-commit.sh)과
        # 같은 스크립트, 같은 기준. 로컬을 --no-verify로 우회해도 여기서 다시 걸린다.
        # PR 전체 diff(베이스...head)를 보므로, 이 PR이 새로 추가한 것만 본다 —
        # 저장소에 이미 있던 중복(기존 부채)은 여기서도 안 걸린다.
        run: python scripts/pr_checks/duplicate_check.py --base origin/develop | tee duplicate_check_output.txt

      - name: 오버라이드 흔적 있으면 게이트키퍼 승인 확인
        id: override_check
        continue-on-error: true
        # 하드블록을 사유를 남기고 강행한 적이 있으면(CLAUDE.md "push 시
        # 오버라이드 흔적 남기기" 참고), push 시 세션이 <!-- wisor-override -->
        # 코멘트를 남긴다. 그 마커가 있는 PR은 naemnaem99가 승인하기 전까지
        # 이 스텝이 계속 실패해서 병합을 막는다 — CODEOWNERS 경로 기반으로는
        # 표현이 안 되는, 흔적 기반 게이트라 여기서 따로 확인한다.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          {
            HAS_OVERRIDE=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
              --jq '[.[] | select(.body | startswith("<!-- wisor-override -->"))] | length > 0')

            if [ "$HAS_OVERRIDE" != "true" ]; then
              echo "오버라이드 흔적 없음."
              exit 0
            fi

            APPROVED=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate \
              --jq '[.[] | select(.user.login == "naemnaem99" and .state == "APPROVED")] | length > 0')

            if [ "$APPROVED" = "true" ]; then
              echo "오버라이드 흔적 있음. naemnaem99 승인 완료."
              exit 0
            fi

            echo "오버라이드 흔적이 있는데 naemnaem99(게이트키퍼) 승인이 아직 없습니다."
            exit 1
          } | tee override_check_output.txt

      - name: 결과 코멘트 게시
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MARKER: "<!-- wisor-auto-checks -->"
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_CHECK: ${{ steps.merge_check.outcome }}
          DP_TEST: ${{ steps.dp_test.outcome }}
          WEB_BUILD: ${{ steps.web_build.outcome }}
          BUNDLE_LEAK: ${{ steps.bundle_leak.outcome }}
          TSC_CHECK: ${{ steps.tsc_check.outcome }}
          BOUNDARY_CHECK: ${{ steps.boundary_check.outcome }}
          DUPLICATE_CHECK: ${{ steps.duplicate_check.outcome }}
          OVERRIDE_CHECK: ${{ steps.override_check.outcome }}
          FORMAT_CHECK: ${{ steps.format_check.outcome }}
        run: |
          mark() { [ "$1" = "success" ] && echo "✅ 통과" || echo "❌ 실패"; }
          soft_mark() { [ "$1" = "success" ] && echo "✅ 통과" || echo "⚠️ 형식 확인 필요"; }

          # 실패한 검사는 원본 에러를 접이식 블록으로 붙인다 — 사람이 Actions
          # 로그를 따로 열어보지 않아도 뭐가 깨졌는지 바로 보이게 한다.
          # push 전 로컬 검수(/code-review+/simplify)가 실패 내역을 참고해 쉬운 말로 설명해준다.
          append_output() {
            local label="$1" outcome="$2" file="$3"
            if [ "$outcome" != "success" ] && [ -f "$file" ]; then
              echo "<details><summary><strong>${label} 실패 내용</strong></summary>"
              echo
              echo '```'
              tail -n 40 "$file"
              echo '```'
              echo "</details>"
              echo
            fi
          }

          BODY_FILE=$(mktemp)
          {
            echo "$MARKER"
            # reopened 시 재실행 여부를 판단하는 근거(check-if-needed 잡)로 쓴다.
            echo "<!-- reviewed-sha: $HEAD_SHA -->"
            echo "## PR 자동검사 결과"
            echo
            echo "| 항목 | 결과 |"
            echo "|---|---|"
            echo "| develop 병합 가능 여부 | $(mark "$MERGE_CHECK") |"
            echo "| data-pipeline pytest -q | $(mark "$DP_TEST") |"
            echo "| apps/web npm run build | $(mark "$WEB_BUILD") |"
            echo "| apps/web 번들 누출 검사 | $(mark "$BUNDLE_LEAK") |"
            echo "| apps/web npx tsc --noEmit | $(mark "$TSC_CHECK") |"
            echo "| 경계 검사 (lib/scores import) | $(mark "$BOUNDARY_CHECK") |"
            echo "| 문자 그대로의 중복 검사 | $(mark "$DUPLICATE_CHECK") |"
            echo "| 오버라이드 게이트키퍼 승인 | $(mark "$OVERRIDE_CHECK") |"
            echo "| PR 제목·본문 형식 (참고용, 병합 안 막음) | $(soft_mark "$FORMAT_CHECK") |"
            echo

            append_output "develop 병합 가능 여부" "$MERGE_CHECK" merge_check_output.txt
            append_output "data-pipeline pytest -q" "$DP_TEST" dp_test_output.txt
            append_output "apps/web npm run build" "$WEB_BUILD" web_build_output.txt
            append_output "apps/web 번들 누출 검사" "$BUNDLE_LEAK" bundle_leak_output.txt
            append_output "apps/web npx tsc --noEmit" "$TSC_CHECK" tsc_check_output.txt
            append_output "경계 검사" "$BOUNDARY_CHECK" boundary_check_output.txt
            append_output "문자 그대로의 중복 검사" "$DUPLICATE_CHECK" duplicate_check_output.txt
            append_output "오버라이드 게이트키퍼 승인" "$OVERRIDE_CHECK" override_check_output.txt

            if [ "$FORMAT_CHECK" != "success" ] && [ -f format_check_output.txt ]; then
              echo "**형식 확인 필요:**"
              echo
              tail -n +2 format_check_output.txt
              echo
            fi

            echo "규칙·문구·클린코드 판단은 push 전 로컬 검수 결과가 별도 코멘트(wisor-local-review)로 남습니다. 이 표의 항목은 병합을 막을 수 있습니다(테스트 형식 제외)."
          } > "$BODY_FILE"

          EXISTING_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$MARKER\"))][0].id // empty")

          if [ -n "$EXISTING_ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING_ID" -F body=@"$BODY_FILE"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$BODY_FILE"
          fi

      - name: 위반 있으면 실패로 표시
        if: |
          steps.merge_check.outcome == 'failure' ||
          steps.dp_test.outcome == 'failure' ||
          steps.web_build.outcome == 'failure' ||
          steps.bundle_leak.outcome == 'failure' ||
          steps.tsc_check.outcome == 'failure' ||
          steps.boundary_check.outcome == 'failure' ||
          steps.duplicate_check.outcome == 'failure' ||
          steps.override_check.outcome == 'failure'
        run: exit 1
