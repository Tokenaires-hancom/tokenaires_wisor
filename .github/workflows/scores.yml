# scores.json 수동 갱신
#
# 운영 데이터는 OCI의 wisor-batch.timer가 갱신한다. 이 워크플로는 운영 배치가
# 막혔을 때 사람이 선택한 브랜치에서 실행하는 수동 복구 수단이다. 생성 파일만 바뀐
# 커밋은 OCI 앱 자동 배포 대상이 아니므로, 운영 반영 경로는 docs/deploy.md를 따른다.

name: scores 수동 갱신

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full은 SEC까지 다시 받는다. prices는 체결가만 갱신한다"
        type: choice
        options: [prices, full]
        default: prices

concurrency:
  # 전체 수집은 10분 넘게 걸린다. 그 사이 3시간짜리가 끼어들면 두 실행이 같은
  # 파일을 밀어내며 커밋이 엇갈린다.
  group: scores
  cancel-in-progress: false

jobs:
  update:
    environment: env
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 운영 코드는 표준 라이브러리만 쓰지만 검증에는 pytest가 필요하다.
          python-version: "3.12"

      - name: 테스트 의존성 설치
        run: python -m pip install pytest

      - name: 배치 실행
        env:
          TOSS_INVEST_CLIENT_ID: ${{ secrets.TOSS_INVEST_CLIENT_ID }}
          TOSS_INVEST_CLIENT_SECRET: ${{ secrets.TOSS_INVEST_CLIENT_SECRET }}
          WISOR_SEC_USER_AGENT: ${{ secrets.WISOR_SEC_USER_AGENT }}
        working-directory: data-pipeline
        run: >-
          python run_batch.py
          --provider sec-toss
          --mode "${{ inputs.mode }}"
          --universe data/universe_us.json

      - name: 점수 검사
        working-directory: data-pipeline
        # 금지 문구와 점수 규칙은 배치가 통과했다고 끝이 아니다. 망가진 결과를
        # 커밋해서 배포까지 나가는 것을 여기서 막는다.
        run: python -m pytest -q

      - name: 바뀐 것이 있으면 커밋
        run: |
          git config user.name "wisor-batch"
          git config user.email "noreply@users.noreply.github.com"
          git add apps/web/lib/generated/scores.json data-pipeline/data/fundamentals.json
          if git diff --cached --quiet; then
            echo "값이 그대로입니다. 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "${{ inputs.mode }} 실행으로 scores.json을 갱신한다"
          git push
