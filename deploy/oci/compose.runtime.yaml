services:
  web:
    environment:
      SCORES_JSON_PATH: /runtime/scores.json
    volumes:
      - type: bind
        source: ${WISOR_RUNTIME_DIR:-/var/lib/wisor/runtime}
        target: /runtime
        read_only: true
        bind:
          create_host_path: false

  persona:
    environment:
      SCORES_JSON_PATH: /runtime/scores.json
    volumes:
      - type: bind
        source: ${WISOR_RUNTIME_DIR:-/var/lib/wisor/runtime}
        target: /runtime
        read_only: true
        bind:
          create_host_path: false
