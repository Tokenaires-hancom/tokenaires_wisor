# Netlify 배포 설정
#
# 저장소 루트에는 package.json이 없다. 웹 앱은 apps/web 안에만 있고 락파일도
# 거기 하나뿐이다. base를 잡으면 빌드가 그 디렉터리에서 돈다.
#
# plugins를 명시하는 이유. 단일 저장소라면 Netlify가 Next.js를 감지해 Runtime을
# 자동으로 붙이지만, 루트에 package.json이 없는 모노레포에서는 붙지 않았다.
# 배포 기록에 framework는 next로 잡히는데 plugin_state가 none이고 함수도 0개였다.
# 어댑터가 돌지 않으면 빌드 산출물이 변환되지 않아 모든 경로가 404가 된다.
#
# publish를 함께 적어 둔다. 어댑터가 붙으면 어댑터가 발행 위치를 정하므로 이 값은
# 무시된다. 붙지 않았을 때가 문제인데, 이 줄이 없으면 base 디렉터리가 통째로
# 발행돼 소스가 그대로 공개된다. 실제로 그렇게 나갔다. 실패하더라도 .next가
# 발행되는 쪽이 낫다.
#
# Netlify UI의 Build settings는 비워 둔다. 이 파일이 UI 설정을 덮어쓰므로
# 양쪽에 적으면 나중에 값이 어긋났을 때 UI 쪽이 조용히 무시된다.

[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  # package.json의 engines가 node >=23이다. Netlify는 engines 필드로 런타임을
  # 고르지 않고 기본 버전을 쓰므로 여기서 못 박는다. 로컬 개발도 24다.
  NODE_VERSION = "24"

# 버전을 고정하지 않는다. Netlify가 빌드마다 최신으로 올려 준다.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# 여기에 없지만 반드시 필요한 것 — NEXT_PUBLIC_CHART_API
#
# 이 값은 next.config.mjs가 빌드 시점에 브라우저 번들로 굽는다. Netlify UI의
# 환경변수에 차트 분석 서비스(services/chart-api) 주소를 넣어야 한다. 넣지 않으면
# 기본값 http://localhost:8000이 그대로 구워져서 방문자의 로컬을 호출하고,
# https 사이트에서 http 요청이라 브라우저가 mixed content로 차단한다.
#
# 값을 이 파일에 적지 않는 이유는 환경마다 다르고, 지금은 chart-api를 어디에
# 띄울지 정해지지 않았기 때문이다. 잘못된 주소를 굽는 것보다 비워 두는 편이 낫다.
